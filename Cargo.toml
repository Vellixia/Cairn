[workspace]
resolver = "2"
members = [
    "crates/cairn-core",
    "crates/cairn-git",
    "crates/cairn-store",
    "crates/cairn-integrate",
    "crates/cairnd",
    "crates/cairn",
    "crates/cairn-server",
    "tests",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/Vellixia/Cairn"

[workspace.dependencies]
cairn-core = { path = "crates/cairn-core" }
cairn-git = { path = "crates/cairn-git" }
cairn-store = { path = "crates/cairn-store" }
cairn-integrate = { path = "crates/cairn-integrate" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "time",
    "signal",
    "process",
    "fs",
    "sync",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "chrono",
    "uuid",
    "json",
] }
clap = { version = "4", features = ["derive", "env"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
argon2 = "0.5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
dirs = "5"
semver = "1"
flate2 = "1"
tar = "0.4"
tempfile = "3"
jsonc-parser = { version = "0.33", features = ["cst", "serde"] }
toml_edit = "0.22"
include_dir = "0.7"

[profile.release]
lto = "thin"
strip = true
