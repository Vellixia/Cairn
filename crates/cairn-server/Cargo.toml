[package]
name = "cairn-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cairn-server"
path = "src/main.rs"

[dependencies]
cairn-core.workspace = true
# The health matrix vocabulary — `MatrixStatus`, `MatrixCapability` and the
# coherence rule — is defined once in `cairn-integrate::capability` and used by
# the reporter and by this server's validation. A second copy here would be a
# second place for "what counts as a healthy cell" to drift, which is the
# failure the shared type exists to prevent. Already a workspace member, so the
# SC-737 dependency baseline is unchanged.
cairn-integrate.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
clap.workspace = true
reqwest.workspace = true
