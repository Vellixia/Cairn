# Cairn shared-memory stack: PostgreSQL, the server, and the web UI.
#
# The local agent — `cairn` and `cairnd` — is NOT part of this stack. It runs
# natively on the developer's machine and talks to this server over HTTPS.
#
# browser / cairn / cairnd ──HTTPS──▶ nginx ──▶ cairn-web
#                                           └──▶ cairn-server ──▶ PostgreSQL
#
# Copy .env.example to .env and edit it before starting.

name: cairn

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - cairn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Not published: only the server needs to reach the database.
    expose:
      - "5432"

  server:
    image: ghcr.io/vellixia/cairn-server:${CAIRN_VERSION:-0.1.0-alpha.9}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The server applies its migrations on start; no separate step.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CAIRN_SERVER_ADDR: 0.0.0.0:8080
      CAIRN_WEB_ORIGIN: ${CAIRN_WEB_ORIGIN:-http://127.0.0.1:8080}
      # The operator's account, defined here rather than registered through the
      # UI. Blank means seed nothing. Values bootstrap a fresh database or one
      # with no administrator; they do not replace a web-rotated password.
      CAIRN_ADMIN_EMAIL: ${CAIRN_ADMIN_EMAIL:-}
      CAIRN_ADMIN_PASSWORD: ${CAIRN_ADMIN_PASSWORD:-}
      CAIRN_ADMIN_DISPLAY_NAME: ${CAIRN_ADMIN_DISPLAY_NAME:-Admin}
    expose:
      - "8080"

  web:
    image: ghcr.io/vellixia/cairn-web:${CAIRN_VERSION:-0.1.0-alpha.9}
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "3100"
    environment:
      # Where the browser should reach the API. Leave it empty behind a reverse
      # proxy that serves the UI at `/` and the API at `/api` on one hostname —
      # the UI then calls the same origin it was loaded from, which is the
      # arrangement to prefer. Set it only for a split-origin deployment, for
      # example https://cairn-api.example.com. Read on every request, so
      # changing it is an edit and a restart, never a rebuild.
      CAIRN_API_ORIGIN: ${CAIRN_API_ORIGIN:-}

  # Default browser topology. Nginx is the only public service: `/` goes to
  # web and `/api` goes to server. For a split origin, do not publish this
  # proxy; expose an HTTPS API separately, set CAIRN_API_ORIGIN on web, and set
  # CAIRN_WEB_ORIGIN to that exact web origin.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - server
      - web
    ports:
      - "${CAIRN_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  cairn-postgres:
