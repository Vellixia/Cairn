# Cairn shared-memory stack: PostgreSQL, the server, and the web UI.
#
# The local agent — `cairn` and `cairnd` — is NOT part of this stack. It runs
# natively on the developer's machine and talks to this server over HTTPS.
#
#   cairn / cairnd  ──HTTPS──▶  cairn-server  ──▶  PostgreSQL
#                                     ▲
#                                cairn-web
#
# Copy .env.example to .env and edit it before starting.

name: cairn

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - cairn-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Not published: only the server needs to reach the database.
    expose:
      - "5432"

  server:
    image: ghcr.io/vellixia/cairn-server:${CAIRN_VERSION:-0.1.0-alpha.1}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The server applies its migrations on start; no separate step.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CAIRN_SERVER_ADDR: 0.0.0.0:8080
      CAIRN_WEB_ORIGIN: ${CAIRN_WEB_ORIGIN:-http://127.0.0.1:3100}
    ports:
      - "${CAIRN_SERVER_PORT:-8080}:8080"

  web:
    image: ghcr.io/vellixia/cairn-web:${CAIRN_VERSION:-0.1.0-alpha.1}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CAIRN_WEB_PORT:-3100}:3100"
    # The browser bundle is compiled with its API origin baked in. The published
    # image targets http://127.0.0.1:8080; to point the UI elsewhere, rebuild:
    #   docker build -f docker/web.Dockerfile \
    #     --build-arg NEXT_PUBLIC_CAIRN_API=https://cairn.example.com -t cairn-web .

volumes:
  cairn-postgres:
