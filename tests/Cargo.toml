[package]
name = "cairn-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
cairn-core.workspace = true
cairn-store.workspace = true
cairn-sys.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
# The performance suite asserts the build-time budget claim the level
# derivation makes, so it needs the crate that makes it.
cairn-integrate.workspace = true
uuid.workspace = true
tokio.workspace = true
sqlx.workspace = true
tiktoken-rs = "0.12"
chrono.workspace = true
# SC-737 compares the workspace dependency manifest against
# `feature005/dependency-baseline.toml` and fails on any added datastore,
# broker or worker-platform entry. Reading a Cargo.toml needs a TOML parser,
# and `toml_edit` is already a workspace dependency — adding a second one to
# run the "we added no dependencies" assertion would be its own small joke.
toml_edit.workspace = true
