# PostgreSQL for cairn-server development and integration tests.
# Nothing else belongs here: the local daemon is SQLite and needs no services.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn
      POSTGRES_DB: cairn
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 2s
      timeout: 3s
      retries: 30
