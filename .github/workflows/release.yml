name: Release candidate

on:
  push:
    branches: ["main", "codex/alpha*-main"]
  workflow_dispatch:

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  # Build and test one committed source revision before any public version tag.
  # --------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Record candidate version
        id: version
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clean -p cairn-server -p cairn-e2e

      # The end-to-end suite drives the real binaries, and `cargo test` does not
      # build another package's binaries.
      - run: cargo build --locked --workspace

      - name: Test
        env:
          CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5433/cairn
        run: cargo test --locked --workspace --all-targets

  # The exact source commit must pass every release-critical source gate. CI's
  # green result may belong to another commit and cannot accept this candidate.
  candidate-gates:
    name: candidate gates
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5433/cairn
      DATABASE_URL: postgres://cairn:cairn@localhost:5433/cairn
      NEXT_PUBLIC_CAIRN_API: http://127.0.0.1:8080
      CAIRN_WEB_URL: http://127.0.0.1:3100
      CAIRN_ADMIN_EMAIL: e2e-admin@example.test
      CAIRN_ADMIN_PASSWORD: hunter2hunter2
      CAIRN_ADMIN_DISPLAY_NAME: E2E Administrator
      CAIRN_SERVER_BIN: ${{ github.workspace }}/target/release/cairn-server
    steps:
      - uses: actions/checkout@v4

      - name: Record exact candidate identity
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p candidate-evidence
          printf 'version=%s\nsource_sha=%s\nworkflow_run=%s\n' "$VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" > candidate-evidence/identity.txt

      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build release server for browser gate
        run: cargo build --release --locked -p cairn-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web contract, types, and production build
        working-directory: web
        run: |
          npm ci
          npm run api-contract:check
          npm run typecheck
          npm run build
      - name: Start candidate server
        run: |
          nohup ./target/release/cairn-server --addr 127.0.0.1:8080 --web-origin http://127.0.0.1:3100 > server.log 2>&1 &
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 && exit 0; sleep 0.5; done
          cat server.log; exit 1
      - name: Start candidate web
        working-directory: web
        run: |
          nohup npm start > web.log 2>&1 &
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:3100/login >/dev/null 2>&1 && exit 0; sleep 0.5; done
          cat web.log; exit 1
      - name: Browser primary journey
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Browser logs and traces
        if: failure()
        run: |
          cat server.log || true
          cat web/web.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-web-evidence
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-identity
          path: candidate-evidence/identity.txt
          if-no-files-found: error
          retention-days: 30


  # --------------------------------------------------------------------------
  # Compute the Skill ref the final publication must create (D29a).
  #
  # CC Switch's downloader builds `…/archive/refs/heads/{branch}.zip` and, on
  # any miss, silently retries `main` and then `master`. So a wrong or absent
  # branch does not fail — it installs whatever is on the default branch, which
  # is the worst possible outcome and an invisible one. Everything here exists
  # to make that impossible:
  #
  #   * the branch is named for content (`skill-release/<schema>-<revision>`),
  #     so a name that resolves is a name whose content is known;
  #   * it is created once at the release commit and **never moved**, so a
  #     developer who installed it keeps what they installed;
  #   * it is verified by fetching it back the way CC Switch does and
  #     recomputing the revision from the fetched tree, in both the created and
  #     the already-present case.
  #
  # Publication verifies this ref before tagging the tested candidate.
  # --------------------------------------------------------------------------
  compute-skill:
    name: compute the Skill ref
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      skill_schema: ${{ steps.ref.outputs.skill_schema }}
      skill_revision: ${{ steps.ref.outputs.skill_revision }}
      skill_branch: ${{ steps.ref.outputs.skill_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # Computed by the same code the released binary and `cairn doctor` use,
      # never reimplemented in shell.
      - name: Compute the Skill revision
        id: ref
        run: |
          set -euo pipefail
          json=$(cargo run -q --locked -p cairn-integrate --bin skillref -- --json)
          echo "$json"
          schema=$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skill_schema"])')
          revision=$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skill_revision"])')
          branch=$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skill_branch"])')
          echo "skill_schema=$schema" >> "$GITHUB_OUTPUT"
          echo "skill_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "skill_branch=$branch" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # Native archives. Each target builds on a runner of its own architecture, so
  # nothing is cross-compiled and nothing needs a cross toolchain.
  # --------------------------------------------------------------------------
  binaries:
    name: ${{ matrix.target }}
    # The computed Skill ref is embedded, then created at publication.
    needs: [verify, candidate-gates, compute-skill]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        env:
          CAIRN_SKILL_BRANCH: ${{ needs.compute-skill.outputs.skill_branch }}
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p cairn -p cairnd -p cairn-server

      # Windows binaries carry `.exe` and are archived as `.zip`, the native
      # convention there; every other target keeps `.tar.gz`. `shell: bash`
      # keeps one script for all four runners — GitHub's Windows images ship
      # Git Bash for exactly this.
      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          name="cairn-v${VERSION}-${{ matrix.target }}"
          stage="dist/$name"
          mkdir -p "$stage"

          ext=""
          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
            ext=".exe"
          fi

          cp "target/${{ matrix.target }}/release/cairn$ext" "$stage/"
          cp "target/${{ matrix.target }}/release/cairnd$ext" "$stage/"
          cp "target/${{ matrix.target }}/release/cairn-server$ext" "$stage/"
          cp LICENSE "$stage/"
          cp CHANGELOG.md "$stage/"

          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
          cat > "$stage/INSTALL.md" <<EOF
          # Cairn v${VERSION} — ${{ matrix.target }}

          Put \`cairn.exe\` and \`cairnd.exe\` in the same folder and add it to
          your PATH; \`cairn\` starts the daemon on its own.

              mkdir "\$env:LOCALAPPDATA\Cairn"
              Copy-Item cairn.exe,cairnd.exe "\$env:LOCALAPPDATA\Cairn"
              setx PATH "\$env:PATH;\$env:LOCALAPPDATA\Cairn"

          Open a new terminal, then inside a Git repository:

              cairn setup

          \`cairn-server.exe\` is only needed if you host shared project memory
          yourself. Most people do not need it.
          EOF
          else
          cat > "$stage/INSTALL.md" <<EOF
          # Cairn v${VERSION} — ${{ matrix.target }}

          Put \`cairn\` and \`cairnd\` on your PATH; they must sit in the same
          directory, because \`cairn\` starts the daemon on its own.

              sudo install -m 0755 cairn cairnd /usr/local/bin/

          Then, inside a Git repository:

              cairn setup

          \`cairn-server\` is only needed if you host shared project memory
          yourself. Most people do not need it.
          EOF
          fi

          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
            # 7-Zip ships with the Windows runner image; `zip` does not.
            (cd dist && 7z a -tzip -bso0 "../$name.zip" "$name")
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -C dist -czf "$name.tar.gz" "$name"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke-test the packaged binaries
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          name="cairn-v${VERSION}-${{ matrix.target }}"
          ext=""
          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
            ext=".exe"
          fi
          # Only a native archive can be executed on this runner.
          case "${{ matrix.target }}" in
            x86_64-apple-darwin)
              echo "cross-built for Intel macOS; skipping execution on arm64"
              exit 0 ;;
          esac
          tmp=$(mktemp -d)
          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
            7z x -bso0 -o"$tmp" "$name.zip"
          else
            tar -C "$tmp" -xzf "$name.tar.gz"
          fi
          bin="$tmp/$name"
          "$bin/cairn$ext" --version
          "$bin/cairnd$ext" --version
          "$bin/cairn-server$ext" --version
          "$bin/cairn$ext" --help > /dev/null
          "$bin/cairn$ext" setup --help > /dev/null
          "$bin/cairn$ext" --version | grep -q "${VERSION}"
          "$bin/cairnd$ext" --version | grep -q "${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Checksums and an SBOM over the archives that will actually be published.
  # --------------------------------------------------------------------------
  assets:
    name: checksums and SBOM
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip | tee SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz,dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          retention-days: 30
          if-no-files-found: error

  # This is intentionally an archive, not a workspace binary. It starts the
  # packaged server/daemon, creates an authorized project, then runs packaged
  # `cairn setup` in a disposable Codex home and Git checkout.
  archive-journey:
    name: installed archive journey
    needs: [verify, candidate-gates, binaries]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archive-x86_64-unknown-linux-gnu
          path: dist
      - name: Packaged setup journey
        env:
          CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5433/cairn
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          name="cairn-v${VERSION}-x86_64-unknown-linux-gnu"
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf "dist/$name.tar.gz"
          scripts/release-archive-journey.sh "$tmp/$name"

  # --------------------------------------------------------------------------
  # Server and web images, multi-platform, pushed to GHCR with the release
  # candidate run ID only. Version tags are promoted after evidence approval.
  # --------------------------------------------------------------------------
  images:
    name: image (${{ matrix.component }})
    needs: [verify, candidate-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: server
            dockerfile: docker/server.Dockerfile
          - component: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/cunilab/cairn-${{ matrix.component }}:candidate-${{ github.run_id }}
          labels: |
            org.opencontainers.image.title=cairn-${{ matrix.component }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/cunilab/Cairn
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Attest the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/cunilab/cairn-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record image digest
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p image-digest
          printf '%s %s\n' "$COMPONENT" "$DIGEST" > "image-digest/$COMPONENT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.component }}
          path: image-digest/${{ matrix.component }}.txt
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Seal the candidate's artifact identity for the separate publish workflow.
  # --------------------------------------------------------------------------
  manifest:
    name: candidate manifest
    needs: [verify, candidate-gates, compute-skill, assets, archive-journey, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: image-digest
      - name: Seal manifest
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SKILL_BRANCH: ${{ needs.compute-skill.outputs.skill_branch }}
          SKILL_REVISION: ${{ needs.compute-skill.outputs.skill_revision }}
          SKILL_SCHEMA: ${{ needs.compute-skill.outputs.skill_schema }}
        run: |
          set -euo pipefail
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          (cd dist && sha256sum -c SHA256SUMS)
          test -s image-digest/server.txt
          test -s image-digest/web.txt
          mkdir -p candidate
          printf 'source_sha=%s\nrun_id=%s\nversion=%s\nskill_schema=%s\nskill_revision=%s\nskill_branch=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$VERSION" "$SKILL_SCHEMA" "$SKILL_REVISION" "$SKILL_BRANCH" > candidate/manifest.txt
          cat dist/SHA256SUMS >> candidate/manifest.txt
          cat image-digest/*.txt >> candidate/manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-manifest
          path: candidate/manifest.txt
          retention-days: 30
          if-no-files-found: error
