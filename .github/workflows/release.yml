name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  # The tag must agree with the workspace version, and the tree must pass the
  # same gates CI enforces. Everything downstream builds from this exact commit.
  # --------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Tag version matches the workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $crate"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The end-to-end suite drives the real binaries, and `cargo test` does not
      # build another package's binaries.
      - run: cargo build --workspace

      - name: Test
        env:
          CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5433/cairn
        run: cargo test --workspace --all-targets


  # --------------------------------------------------------------------------
  # Publish the Skill ref CC Switch will fetch (D29a).
  #
  # CC Switch's downloader builds `…/archive/refs/heads/{branch}.zip` and, on
  # any miss, silently retries `main` and then `master`. So a wrong or absent
  # branch does not fail — it installs whatever is on the default branch, which
  # is the worst possible outcome and an invisible one. Everything here exists
  # to make that impossible:
  #
  #   * the branch is named for content (`skill-release/<schema>-<revision>`),
  #     so a name that resolves is a name whose content is known;
  #   * it is created once at the release commit and **never moved**, so a
  #     developer who installed it keeps what they installed;
  #   * it is verified by fetching it back the way CC Switch does and
  #     recomputing the revision from the fetched tree, in both the created and
  #     the already-present case.
  #
  # A mismatch fails the release rather than shipping a binary that points at
  # a branch whose content is not what its name claims.
  # --------------------------------------------------------------------------
  publish-skill:
    name: publish the Skill ref
    needs: verify
    runs-on: ubuntu-latest
    # The only job in this workflow that writes a ref, and the only one that
    # can.
    permissions:
      contents: write
    outputs:
      skill_schema: ${{ steps.ref.outputs.skill_schema }}
      skill_revision: ${{ steps.ref.outputs.skill_revision }}
      skill_branch: ${{ steps.ref.outputs.skill_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # Computed by the same code the released binary and `cairn doctor` use,
      # never reimplemented in shell.
      - name: Compute the Skill revision
        id: ref
        run: |
          set -euo pipefail
          json=$(cargo run -q -p cairn-integrate --bin skillref -- --json)
          echo "$json"
          schema=$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skill_schema"])')
          revision=$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skill_revision"])')
          branch=$(echo "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["skill_branch"])')
          echo "skill_schema=$schema" >> "$GITHUB_OUTPUT"
          echo "skill_revision=$revision" >> "$GITHUB_OUTPUT"
          echo "skill_branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create the branch, or leave the existing one exactly where it is
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.ref.outputs.skill_branch }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH already exists; it is named for its content and is never moved"
          else
            echo "creating $BRANCH at $GITHUB_SHA"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

      - name: Verify the branch the way CC Switch fetches it
        env:
          BRANCH: ${{ steps.ref.outputs.skill_branch }}
          REVISION: ${{ steps.ref.outputs.skill_revision }}
        run: |
          set -euo pipefail
          # Exactly the URL CC Switch builds. A miss here is the silent
          # `main` fallback, so a miss must fail loudly instead.
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/heads/${BRANCH}.zip"
          tmp=$(mktemp -d)
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" -o "$tmp/skill.zip"; then break; fi
            echo "attempt $attempt: the ref is not servable yet; waiting"
            sleep 5
            if [ "$attempt" = "5" ]; then
              echo "::error::$url is not fetchable, so CC Switch would silently install main"
              exit 1
            fi
          done
          unzip -q "$tmp/skill.zip" -d "$tmp/tree"
          root=$(find "$tmp/tree" -maxdepth 1 -mindepth 1 -type d | head -n1)
          # Recompute from the *fetched* tree, not from the checkout.
          fetched=$(cargo run -q -p cairn-integrate --bin skillref -- --json \
            --dir "$root/skills/cairn" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["skill_revision"])')
          echo "expected $REVISION, fetched $fetched"
          if [ "$fetched" != "$REVISION" ]; then
            echo "::error::$BRANCH serves revision $fetched, not the $REVISION its name claims"
            exit 1
          fi

  # --------------------------------------------------------------------------
  # Native archives. Each target builds on a runner of its own architecture, so
  # nothing is cross-compiled and nothing needs a cross toolchain.
  # --------------------------------------------------------------------------
  binaries:
    name: ${{ matrix.target }}
    # The Skill ref is a *build input*: `CAIRN_SKILL_BRANCH` reaches the
    # compiler only after the verification fetch above passed, so a released
    # binary can never point at a branch that does not exist (D29a).
    needs: [verify, publish-skill]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        env:
          CAIRN_SKILL_BRANCH: ${{ needs.publish-skill.outputs.skill_branch }}
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            -p cairn -p cairnd -p cairn-server

      # Windows binaries carry `.exe` and are archived as `.zip`, the native
      # convention there; every other target keeps `.tar.gz`. `shell: bash`
      # keeps one script for all four runners — GitHub's Windows images ship
      # Git Bash for exactly this.
      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          name="cairn-v${VERSION}-${{ matrix.target }}"
          stage="dist/$name"
          mkdir -p "$stage"

          ext=""
          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
            ext=".exe"
          fi

          cp "target/${{ matrix.target }}/release/cairn$ext" "$stage/"
          cp "target/${{ matrix.target }}/release/cairnd$ext" "$stage/"
          cp "target/${{ matrix.target }}/release/cairn-server$ext" "$stage/"
          cp LICENSE "$stage/"
          cp CHANGELOG.md "$stage/"

          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
          cat > "$stage/INSTALL.md" <<EOF
          # Cairn v${VERSION} — ${{ matrix.target }}

          Put \`cairn.exe\` and \`cairnd.exe\` in the same folder and add it to
          your PATH; \`cairn\` starts the daemon on its own.

              mkdir "\$env:LOCALAPPDATA\Cairn"
              Copy-Item cairn.exe,cairnd.exe "\$env:LOCALAPPDATA\Cairn"
              setx PATH "\$env:PATH;\$env:LOCALAPPDATA\Cairn"

          Open a new terminal, then inside a Git repository:

              cairn init
              cairn connect claude-code

          \`cairn-server.exe\` is only needed if you host shared project memory
          yourself. Most people do not need it.
          EOF
          else
          cat > "$stage/INSTALL.md" <<EOF
          # Cairn v${VERSION} — ${{ matrix.target }}

          Put \`cairn\` and \`cairnd\` on your PATH; they must sit in the same
          directory, because \`cairn\` starts the daemon on its own.

              sudo install -m 0755 cairn cairnd /usr/local/bin/

          Then, inside a Git repository:

              cairn init
              cairn connect claude-code

          \`cairn-server\` is only needed if you host shared project memory
          yourself. Most people do not need it.
          EOF
          fi

          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
            # 7-Zip ships with the Windows runner image; `zip` does not.
            (cd dist && 7z a -tzip -bso0 "../$name.zip" "$name")
            echo "archive=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -C dist -czf "$name.tar.gz" "$name"
            echo "archive=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke-test the packaged binaries
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          name="cairn-v${VERSION}-${{ matrix.target }}"
          ext=""
          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
            ext=".exe"
          fi
          # Only a native archive can be executed on this runner.
          case "${{ matrix.target }}" in
            x86_64-apple-darwin)
              echo "cross-built for Intel macOS; skipping execution on arm64"
              exit 0 ;;
          esac
          tmp=$(mktemp -d)
          if [[ "${{ matrix.target }}" == *-pc-windows-* ]]; then
            7z x -bso0 -o"$tmp" "$name.zip"
          else
            tar -C "$tmp" -xzf "$name.tar.gz"
          fi
          bin="$tmp/$name"
          "$bin/cairn$ext" --version
          "$bin/cairnd$ext" --version
          "$bin/cairn-server$ext" --version
          "$bin/cairn$ext" --help > /dev/null
          "$bin/cairn$ext" --version | grep -q "${VERSION}"
          "$bin/cairnd$ext" --version | grep -q "${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Checksums and an SBOM over the archives that will actually be published.
  # --------------------------------------------------------------------------
  assets:
    name: checksums and SBOM
    needs: [verify, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.zip | tee SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/SBOM.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz,dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Server and web images, multi-platform, pushed to GHCR with the release
  # version and an immutable sha- tag. No `latest` for a pre-release.
  # --------------------------------------------------------------------------
  images:
    name: image (${{ matrix.component }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: server
            dockerfile: docker/server.Dockerfile
          - component: web
            dockerfile: docker/web.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/vellixia/cairn-${{ matrix.component }}:${{ needs.verify.outputs.version }}
            ghcr.io/vellixia/cairn-${{ matrix.component }}:sha-${{ needs.verify.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=cairn-${{ matrix.component }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Vellixia/Cairn
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Attest the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/vellixia/cairn-${{ matrix.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # --------------------------------------------------------------------------
  # Publish. Pre-release for anything carrying a pre-release suffix.
  # --------------------------------------------------------------------------
  release:
    name: publish
    needs: [verify, assets, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Cairn v$VERSION" \
            --notes-file .github/release-notes/v${VERSION}.md \
            $prerelease \
            dist/*
