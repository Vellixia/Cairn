name: Publish verified release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release candidate workflow run ID
        required: true
      evidence_commit:
        description: Commit containing the completed release evidence report
        required: true

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evidence_commit }}
          fetch-depth: 0
      - name: Fetch candidate artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name candidate-manifest --dir candidate
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-assets --dir dist
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name image-digest-server --dir image-digest
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name image-digest-web --dir image-digest
      - name: Verify exact candidate and evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          source_sha=$(sed -n 's/^source_sha=//p' candidate/manifest.txt)
          version=$(sed -n 's/^version=//p' candidate/manifest.txt)
          run_id=$(sed -n 's/^run_id=//p' candidate/manifest.txt)
          skill_branch=$(sed -n 's/^skill_branch=//p' candidate/manifest.txt)
          skill_revision=$(sed -n 's/^skill_revision=//p' candidate/manifest.txt)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]
          [[ "$skill_revision" =~ ^[0-9a-f]{12}$ ]]
          [[ "$skill_branch" =~ ^skill-release/[0-9]+-$skill_revision$ ]]
          test "$run_id" = "$RUN_ID"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          test "$(jq -r .head_sha <<< "$run")" = "$source_sha"
          test "$(jq -r .conclusion <<< "$run")" = success
          test "$(jq -r .name <<< "$run")" = 'Release candidate'
          evidence_sha=$(git rev-parse HEAD)
          git cat-file -e "$source_sha^{commit}"
          git merge-base --is-ancestor "$source_sha" HEAD
          test "$(git show "$source_sha:Cargo.toml" | grep -m1 '^version' | cut -d'"' -f2)" = "$version"
          report_dir=$(mktemp -d)
          git show "$evidence_sha:.github/release-evidence/v${version}.md" > "$report_dir/v${version}.md"
          git checkout --detach "$source_sha"
          CAIRN_RELEASE_EVIDENCE_DIR="$report_dir" scripts/check-release-evidence.sh "$version" "$source_sha"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            git fetch origin "refs/tags/v$version:refs/tags/v$version"
            test "$(git rev-parse "v$version^{commit}")" = "$source_sha"
          fi
          cmp <(grep -E '^[0-9a-f]{64}  ' candidate/manifest.txt) dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          for component in server web; do
            cmp <(grep "^$component sha256:" candidate/manifest.txt) "image-digest/$component.txt"
            digest=$(cut -d' ' -f2 "image-digest/$component.txt")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          printf 'SOURCE_SHA=%s\nVERSION=%s\nSKILL_BRANCH=%s\nSKILL_REVISION=%s\n' \
            "$source_sha" "$version" "$skill_branch" "$skill_revision" >> "$GITHUB_ENV"
      - name: Publish and verify immutable Skill ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$SKILL_BRANCH" >/dev/null 2>&1; then
            echo "$SKILL_BRANCH already exists; it will not be moved"
          else
            git push origin "$SOURCE_SHA:refs/heads/$SKILL_BRANCH"
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/heads/${SKILL_BRANCH}.zip"
          tmp=$(mktemp -d)
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" -o "$tmp/skill.zip"; then break; fi
            sleep 5
          done
          test -s "$tmp/skill.zip"
          unzip -q "$tmp/skill.zip" -d "$tmp/tree"
          root=$(find "$tmp/tree" -maxdepth 1 -mindepth 1 -type d | head -n1)
          fetched=$(cargo run -q --locked -p cairn-integrate --bin skillref -- --json --dir "$root/skills/cairn" \
            | jq -r .skill_revision)
          test "$fetched" = "$SKILL_REVISION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote tested images by digest
        run: |
          set -euo pipefail
          for component in server web; do
            digest=$(cut -d' ' -f2 "image-digest/$component.txt")
            image="ghcr.io/${GITHUB_REPOSITORY,,}-$component"
            docker buildx imagetools inspect "$image@$digest" >/dev/null
            if docker buildx imagetools inspect "$image:$VERSION" > existing.txt 2>/dev/null; then
              test "$(awk '/^Digest:/ { print $2; exit }' existing.txt)" = "$digest"
            else
              docker buildx imagetools create -t "$image:$VERSION" "$image@$digest"
            fi
            docker buildx imagetools inspect "$image:$VERSION" > published-image.txt
            test "$(awk '/^Digest:/ { print $2; exit }' published-image.txt)" = "$digest"
          done
      - name: Publish tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)" = "$SOURCE_SHA"
          else
            git tag -a "$tag" "$SOURCE_SHA" -m "Cairn $tag"
            git push origin "refs/tags/$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace artifacts" >&2
            exit 1
          fi
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$tag" --verify-tag --title "Cairn $tag" \
            --notes-file ".github/release-notes/$tag.md" "${prerelease[@]}" dist/*
      - name: Verify published archives and images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir published
          cmp published/SHA256SUMS dist/SHA256SUMS
          (cd published && sha256sum -c SHA256SUMS)
          name="cairn-v${VERSION}-x86_64-unknown-linux-gnu"
          tmp=$(mktemp -d)
          tar -C "$tmp" -xzf "published/$name.tar.gz"
          "$tmp/$name/cairn" --version | grep -F "$VERSION"
          "$tmp/$name/cairnd" --version | grep -F "$VERSION"
          "$tmp/$name/cairn-server" --version | grep -F "$VERSION"
          for component in server web; do
            docker buildx imagetools inspect "ghcr.io/${GITHUB_REPOSITORY,,}-$component:$VERSION"
          done
