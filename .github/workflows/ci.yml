            echo "architecture=$(uname -m)"
            rustc --version
            cargo --version
            git --version
            echo "sqlite=$(sqlite3 --version 2>/dev/null || echo unavailable)"
          } | tee target/linux-feature002-logs/environment.txt
      - name: Quality gate
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo fmt --check 2>&1 | tee target/linux-feature002-logs/fmt.log
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee target/linux-feature002-logs/clippy.log
          cargo test --workspace --all-targets 2>&1 | tee target/linux-feature002-logs/workspace-tests.log
      - name: Unix-socket IPC, path, restart, and SQLite behavior
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test -p cairn-daemon --test feature002_ipc -- --nocapture 2>&1 | tee target/linux-feature002-logs/ipc.log
          cargo test -p cairn-cli --test feature002_ipc_only -- --nocapture 2>&1 | tee -a target/linux-feature002-logs/ipc.log
          cargo test -p cairn-daemon --test us1_register_inspect -- --nocapture 2>&1 | tee target/linux-feature002-logs/paths.log
          cargo test -p cairn-daemon --test feature002_binding_restart --test feature002_bound_recovery -- --nocapture 2>&1 | tee target/linux-feature002-logs/restart.log
          cargo test -p cairn-daemon --test feature002_migration_acceptance -- --nocapture 2>&1 | tee target/linux-feature002-logs/sqlite.log
          cargo test -p cairn-storage-local --tests 2>&1 | tee -a target/linux-feature002-logs/sqlite.log
      - name: Quickstart and Feature 002 acceptance
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cargo test -p cairn-daemon --test feature002_quickstart -- --nocapture 2>&1 | tee target/linux-feature002-logs/quickstart.log
          cargo test -p cairn-events --test feature002_replay --test feature002_replay_invalid -- --nocapture 2>&1 | tee target/linux-feature002-logs/replay.log
          cargo test -p cairn-daemon --test feature002_privacy --test feature002_retry_acceptance --test feature002_atomicity --test feature002_binding_races -- --nocapture 2>&1 | tee target/linux-feature002-logs/acceptance.log
          cargo test -p cairn-cli --test feature002_privacy_cli -- --nocapture 2>&1 | tee -a target/linux-feature002-logs/acceptance.log
          grep -F "quickstart_counts=" target/linux-feature002-logs/quickstart.log
          grep -F "feature002_retries=" target/linux-feature002-logs/acceptance.log
      - name: Upload Linux logs and counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-feature002-evidence-${{ inputs.implementation_sha || github.event.pull_request.head.sha || github.sha }}
          path: target/linux-feature002-logs/
          if-no-files-found: error

  windows-feature002-evidence:
    name: Windows exact-SHA Feature 002 acceptance
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.implementation_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify exact implementation SHA
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.implementation_sha || github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "requested_sha=$requested"
          echo "implementation_sha=$actual"
          [ "$actual" = "$requested" ] || { echo "HEAD is not the requested implementation SHA" >&2; exit 1; }
      - name: Configure git identity for fixtures
        shell: pwsh
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@cairn.invalid"
          git config --global core.autocrlf false
      - name: Record exact Windows environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/windows-feature002-logs | Out-Null
          $os = Get-CimInstance Win32_OperatingSystem
          $lines = @(
            "os=$($os.Caption) $($os.Version)",
            "architecture=$env:PROCESSOR_ARCHITECTURE",
            (rustc --version),
            (cargo --version),
            (git --version)
          )
          $lines | Tee-Object -FilePath target/windows-feature002-logs/environment.txt
      - name: Quality gate
        shell: pwsh
        run: |
          cargo fmt --check 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/fmt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/clippy.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --all-targets 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/workspace-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Named-pipe IPC, path, restart, and SQLite behavior
        shell: pwsh
        run: |
          cargo test -p cairn-daemon --test feature002_ipc -- --nocapture 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/named-pipe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p cairn-cli --test feature002_ipc_only -- --nocapture 2>&1 | Tee-Object -Append -FilePath target/windows-feature002-logs/named-pipe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p cairn-daemon --test us1_register_inspect -- --nocapture 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/paths.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p cairn-daemon --test feature002_binding_restart --test feature002_bound_recovery -- --nocapture 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/restart.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p cairn-daemon --test feature002_migration_acceptance -- --nocapture 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/sqlite.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p cairn-storage-local --tests 2>&1 | Tee-Object -Append -FilePath target/windows-feature002-logs/sqlite.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Quickstart and Feature 002 acceptance
        shell: pwsh
        run: |
          cargo test -p cairn-daemon --test feature002_quickstart -- --nocapture 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/quickstart.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p cairn-events --test feature002_replay --test feature002_replay_invalid -- --nocapture 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/replay.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p cairn-daemon --test feature002_privacy --test feature002_retry_acceptance --test feature002_atomicity --test feature002_binding_races -- --nocapture 2>&1 | Tee-Object -FilePath target/windows-feature002-logs/acceptance.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p cairn-cli --test feature002_privacy_cli -- --nocapture 2>&1 | Tee-Object -Append -FilePath target/windows-feature002-logs/acceptance.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Select-String -Path target/windows-feature002-logs/quickstart.log -SimpleMatch "quickstart_counts=" -Quiet
          Select-String -Path target/windows-feature002-logs/acceptance.log -SimpleMatch "feature002_retries=" -Quiet
      - name: Upload Windows logs and counters
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-feature002-evidence-${{ inputs.implementation_sha || github.event.pull_request.head.sha || github.sha }}
          path: target/windows-feature002-logs/
          if-no-files-found: error

  feature002-performance:
    name: SC-010 Feature 002 performance acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.implementation_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify exact implementation SHA
        shell: bash
        run: |
          set -euo pipefail
          requested="${{ inputs.implementation_sha || github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "requested_sha=$requested"
          echo "implementation_sha=$actual"
          [ "$actual" = "$requested" ] || { echo "HEAD is not the requested implementation SHA" >&2; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "checkout is dirty" >&2; exit 1; }
      - name: Configure git identity for fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@cairn.invalid"
      - name: Record exact performance environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/feature002-performance-logs
          {
            . /etc/os-release
            echo "os=$PRETTY_NAME"
            echo "architecture=$(uname -m)"
            rustc --version
            cargo --version
          } | tee target/feature002-performance-logs/environment.txt
      - name: Run SC-010 acceptance in the release profile
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          # The test asserts !cfg!(debug_assertions); a debug run fails by design.
          cargo test --release -p cairn-daemon --test feature002_perf -- --ignored --nocapture 2>&1 \
            | tee target/feature002-performance-logs/feature002-perf.log
          grep -F "feature002_perf_environment" target/feature002-performance-logs/feature002-perf.log
          measured="$(grep -c "feature002_perf operation=" target/feature002-performance-logs/feature002-perf.log)"
          echo "measured_operations=$measured"
          [ "$measured" -eq 10 ] || { echo "incomplete SC-010 measurement set" >&2; exit 1; }
          grep -F "threshold_ms=2000" target/feature002-performance-logs/feature002-perf.log > /dev/null
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature002-performance-${{ inputs.implementation_sha || github.event.pull_request.head.sha || github.sha }}
          path: target/feature002-performance-logs/
          if-no-files-found: error
