name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux carries the full suite: service containers need Docker, so this is
  # the only runner where the PostgreSQL-backed server and sync tests can run.
  rust-linux:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5433/cairn
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Verify the toolchain is the pinned one
        run: |
          pinned=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          active=$(rustc --version | awk '{print $2}')
          echo "pinned=$pinned active=$active"
          test "$pinned" = "$active"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The end-to-end suite drives the real binaries, and `cargo test` does not
      # build another package's binaries. Without these builds there is nothing
      # for it to drive.
      - run: cargo build --workspace
      - run: cargo test --workspace --all-targets

      - run: cargo build --workspace --release
      - name: Capture-hook latency (SC-007 is a release-build claim)
        run: cargo test --release -p cairn-e2e --test polish_performance -- --nocapture

      - name: Working tree is clean and free of conflict markers
        run: |
          git diff --check
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # macOS is a first-class target for the local agent. Service containers are
  # unavailable here (no Docker), so the server and sync suites skip themselves
  # and this job proves the local-first product, which is most of Cairn.
  rust-macos:
    name: rust (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Verify the toolchain is the pinned one
        run: |
          pinned=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          active=$(rustc --version | awk '{print $2}')
          echo "pinned=$pinned active=$active"
          test "$pinned" = "$active"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace --all-targets

      - name: Working tree is clean and free of conflict markers
        run: |
          git diff --check
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # Windows is a first-class target too. Service containers are unavailable
  # here — no Docker, same as macOS — so the server and sync suites skip
  # themselves and this job proves the local-first product, which is most of
  # Cairn, on its named-pipe transport rather than a Unix domain socket.
  rust-windows:
    name: rust (windows-latest)
    runs-on: windows-latest
    # The named-pipe transport is new; a hang here should fail loudly rather
    # than run until someone notices and cancels it by hand.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Verify the toolchain is the pinned one
        shell: bash
        run: |
          pinned=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          active=$(rustc --version | awk '{print $2}')
          echo "pinned=$pinned active=$active"
          test "$pinned" = "$active"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace

      # A tight timeout here, not just the job-level one: a hang should fail
      # fast enough to leave time for the diagnostics step below to actually
      # run, rather than eating the whole job budget before anything gets a
      # chance to look at what was going on.
      #
      # "Tight" is relative to how long the suite actually takes here, and
      # Windows is the slow runner: the same `cargo test` is ~1m25s on Ubuntu
      # and ~2m20s on macOS but around 8m30s on this one, because every
      # sandbox spawns real processes over a named pipe. Five minutes was
      # comfortable until Feature 002 and the daemon's own component tests
      # arrived together; it then killed a run in which every test that got to
      # execute had passed, which is the worst kind of red. This is sized at
      # roughly half again the observed time — still a small fraction of the
      # job budget, so a real hang is reported long before the job expires.
      - name: Test
        timeout-minutes: 12
        env:
          CAIRN_LOG: debug
        run: cargo test --workspace --all-targets

      # Only runs if the step above failed or was killed by its timeout.
      # cargo test's own process tree gets torn down by then, but anything it
      # wrote to disk survives — the daemon logs in particular, since a
      # killed process skips Drop and never gets to clean up its temp dir.
      #
      # Tailed, and capped at the busiest few logs. `CAIRN_LOG=debug` makes
      # each daemon log every statement it runs, and a suite that starts a
      # hundred daemons then buries the one thing anybody came here to read —
      # cargo's own failure summary, printed by the step above — under a
      # megabyte of SQL. What matters in these logs is the end of them.
      - name: Dump daemon logs and process state on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "--- cairnd / cairn processes still running? ---"
          Get-Process -Name cairnd, cairn -ErrorAction SilentlyContinue | Format-Table -AutoSize

          Write-Host "--- daemon logs found under $env:TEMP (newest 10, last 80 lines each) ---"
          Get-ChildItem -Path $env:TEMP -Recurse -Include cairnd.log, cairn.log -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 10 |
            ForEach-Object {
              Write-Host "=== $($_.FullName) ==="
              Get-Content $_.FullName -Tail 80 -ErrorAction SilentlyContinue
              Write-Host ""
            }

      # The release workflow packages Windows as a .zip, and that path only
      # ever runs on a tag — so the first time a mistake in it surfaces would
      # be a release Windows users cannot install. The runner image ships
      # 7-Zip but not `zip`, which is exactly the kind of assumption worth
      # holding to a test. This round-trips the archive with the same tooling
      # the release uses, against binaries this job already built, and stays
      # entirely under RUNNER_TEMP so the working-tree check below is unaffected.
      - name: Release packaging round-trip
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/packaging-check"
          stage="$work/cairn-packaging-check"
          rm -rf "$work"
          mkdir -p "$stage"
          for bin in cairn cairnd cairn-server; do
            cp "target/debug/$bin.exe" "$stage/"
          done
          (cd "$work" && 7z a -tzip -bso0 archive.zip cairn-packaging-check)
          out="$work/extracted"
          7z x -bso0 -o"$out" "$work/archive.zip"
          "$out/cairn-packaging-check/cairn.exe" --version
          "$out/cairn-packaging-check/cairnd.exe" --version
          "$out/cairn-packaging-check/cairn-server.exe" --version

      - name: Working tree is clean and free of conflict markers
        if: success()
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `lint` and `typecheck` both cover `e2e/` now. They did not: `next lint`
      # uses its own default directory set, and the app's tsconfig excludes
      # `e2e`, so the Playwright suite was linted by nothing and typechecked by
      # nothing while still reporting a green `web` job.
      - run: npm run lint
      - name: TypeScript check
        run: npm run typecheck
      - run: npm run build

  # The Playwright suite, actually run.
  #
  # The `web` job above proves the UI compiles; it never proved the acceptance
  # tests pass, because nothing invoked `playwright test`. This job does, against
  # a real server and a real PostgreSQL — the only configuration the suite is
  # written for (D13).
  web-e2e:
    name: web (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://cairn:cairn@localhost:5433/cairn
      NEXT_PUBLIC_CAIRN_API: http://127.0.0.1:8080
      CAIRN_WEB_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      # Release, deliberately. Argon2 is expensive by design and costs ~0.7s
      # per sign-in unoptimized against ~0.03s released; every test signs in,
      # so a debug server reads as a flaky UI rather than a slow hash. The
      # Playwright config says so too.
      - name: Build the server (release)
        run: cargo build --release -p cairn-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # `NEXT_PUBLIC_*` is inlined at build time, so the API origin has to be
      # set here rather than when the server starts.
      - name: Build the web UI
        working-directory: web
        run: npm run build

      - name: Start the server
        run: |
          nohup ./target/release/cairn-server \
            --addr 127.0.0.1:8080 \
            --web-origin http://127.0.0.1:3100 \
            > server.log 2>&1 &
          echo $! > server.pid
          disown
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1; then
              echo "server healthy"; exit 0
            fi
            sleep 0.5
          done
          echo "server never became healthy:"; cat server.log; exit 1

      - name: Start the web UI
        working-directory: web
        run: |
          nohup npm start > web.log 2>&1 &
          echo $! > web.pid
          disown
          for _ in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:3100/login >/dev/null 2>&1; then
              echo "web healthy"; exit 0
            fi
            sleep 0.5
          done
          echo "web never became healthy:"; cat web.log; exit 1

      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: web
        run: npm run test:e2e

      # A failure here is usually in the server or the UI, not the assertion,
      # and neither log is visible without this.
      - name: Logs and traces
        if: failure()
        run: |
          echo "===== server ====="; cat server.log || true
          echo "===== web ====="; cat web/web.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Guards: requirements that a passing test suite cannot demonstrate.
  #
  # Traceability is instant and belongs in its own job so it is never queued
  # behind the container build below.
  guards:
    name: guards (traceability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every requirement is cited by a test, or excused with a reason
        run: bash scripts/requirement-coverage.sh

  # FR-045 / SC-006: the local product works with no network at all.
  #
  # `--network none` leaves the container with loopback only, so a code path that
  # needed the network fails rather than quietly degrading. This existed as a
  # script from the start and nothing ran it, which meant Cairn's offline
  # guarantee was asserted by a file nobody executed — and the `cairn link` bug
  # in this release was an offline-correctness bug that reached a release.
  offline:
    name: offline (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The script warms a registry and target volume with the network allowed,
      # then runs the suite with the network removed. Both phases are the
      # script's own, so this job stays a single call and the local and CI paths
      # cannot drift apart.
      - name: Local suites, no network
        run: bash scripts/network-isolated-tests.sh
      - name: Container logs on failure
        if: failure()
        run: docker volume ls && docker images
