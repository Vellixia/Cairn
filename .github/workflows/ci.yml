name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cairn talks to its daemon over a Unix domain socket, so these are the
        # platforms it actually runs on. Windows is not supported.
        os: [ubuntu-latest, macos-latest]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
          POSTGRES_DB: cairn
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U cairn -d cairn"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Verify the toolchain is the pinned one
        run: |
          pinned=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          active=$(rustc --version | awk '{print $2}')
          echo "pinned=$pinned active=$active"
          test "$pinned" = "$active"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace

      - name: Test
        env:
          CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5433/cairn
        run: cargo test --workspace --all-targets

      # The end-to-end suite drives the real binaries, and `cargo test` does not
      # build another package's binaries. Without this the release-profile run
      # finds nothing to drive.
      - run: cargo build --workspace --release

      - name: Capture-hook latency (SC-007 is a release-build claim)
        env:
          CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@localhost:5433/cairn
        run: cargo test --release -p cairn-e2e --test polish_performance -- --nocapture

      - name: Working tree is clean and free of conflict markers
        run: |
          git diff --check
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - run: npm run build
